name: Daily Signals

on:
  workflow_dispatch:
  schedule:
    # 07:37 Asia/Seoul every day (22:37 UTC previous day)
    - cron: "37 22 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-signals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate scripts
        run: |
          python -m py_compile \
            monitor_signals.py \
            nwg_signal.py \
            energy_signal_monitor.py \
            silver_signal_monitor.py \
            precious_miners_signal_monitor.py \
            qqq_qld_timing_signal.py \
            n1_meta_signal.py \
            build_latest_signal_all.py

      - name: Generate all signal files
        env:
          TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
        run: |
          set -euo pipefail
          python monitor_signals.py
          python nwg_signal.py
          python energy_signal_monitor.py
          python silver_signal_monitor.py
          python precious_miners_signal_monitor.py
          python qqq_qld_timing_signal.py
          python n1_meta_signal.py
          python build_latest_signal_all.py

      - name: Validate N1 output contract
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, sys

          yaml_path = pathlib.Path('strategies/qqq_meta_v1_red_router_s1_n1_v4_shadow_v2_3.kis.yaml')
          signal_path = pathlib.Path('n1_latest_signal.json')
          state_path = pathlib.Path('n1_latest_state_snapshot.json')
          lineage_path = pathlib.Path('n1_liquidity_p_lineage.csv')

          required_files = [yaml_path, signal_path, state_path, lineage_path]
          missing = [str(p) for p in required_files if not p.exists()]
          if missing:
              raise SystemExit(f'Missing N1 outputs: {missing}')

          signal = json.loads(signal_path.read_text(encoding='utf-8'))
          required = {
              'validation_class', 'signal_date', 'execution_date',
              'qqq_adjusted_close', 'sma20', 'sma50', 'sma200', 'wilder_rsi14',
              'trend200_state', 'recovery_state', 'liquidity_p_applied',
              'liquidity_state', 'comparison1_raw_state',
              'comparison1_confirmed_target', 'comparison3_target',
              'final_regime', 'active_engine', 'base_execution_target',
              'n1_overlay_active', 'execution_target', 'rules_sha256'
          }
          absent = sorted(required - signal.keys())
          if absent:
              raise SystemExit(f'N1 output missing fields: {absent}')

          actual_hash = hashlib.sha256(yaml_path.read_bytes()).hexdigest()
          if signal['rules_sha256'] != actual_hash:
              raise SystemExit(
                  f"N1 rules hash mismatch: signal={signal['rules_sha256']} actual={actual_hash}"
              )
          print(f'N1 output contract PASS: {signal["signal_date"]} -> {signal["execution_target"]}')
          PY

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail

          FILES=(
            latest_signal.json
            latest_signal.md
            nwg_latest_signal.json
            nwg_latest_signal.md
            latest_energy_signal.json
            latest_energy_signal.md
            latest_silver_signal.json
            latest_silver_signal.md
            latest_precious_miners_signal.json
            latest_precious_miners_signal.md
            qqq_qld_timing_signal.json
            qqq_qld_timing_signal.md
            n1_latest_signal.json
            n1_latest_signal.md
            n1_latest_state_snapshot.json
            n1_liquidity_p_lineage.csv
            latest_signal_all.md
          )

          if ! git status --porcelain -- "${FILES[@]}" | grep -q .; then
            echo "No signal changes to commit"
          else
            DATE=$(date -u +%F)
            BRANCH="${GITHUB_REF_NAME}"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "${FILES[@]}"
            git commit -m "Update signals: ${DATE}"

            for i in 1 2 3; do
              git pull --rebase origin "${BRANCH}" || true
              if git push origin "HEAD:${BRANCH}"; then
                break
              fi
              sleep 2
            done
          fi

      - name: Create Issue for today's report (always)
        if: always()
        uses: actions/github-script@v8
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = new Date();
            const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
            const kstDate = kst.toISOString().slice(0, 10);
            const kstTime = kst.toISOString().replace('T', ' ').slice(0, 19);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;

            const readText = (p) => {
              try { return fs.readFileSync(p, 'utf8'); }
              catch (e) { return `_(missing: ${p})_`; }
            };
            const readVerdict = (p) => {
              try {
                const obj = JSON.parse(fs.readFileSync(p, 'utf8'));
                return obj && (obj.verdict || obj.execution_target || obj.validation_class)
                  ? String(obj.verdict || obj.execution_target || obj.validation_class)
                  : 'N/A';
              } catch (e) { return 'N/A'; }
            };

            const coreVerdict = readVerdict('latest_signal.json');
            const nwgVerdict = readVerdict('nwg_latest_signal.json');
            const energyVerdict = readVerdict('latest_energy_signal.json');
            const silverVerdict = readVerdict('latest_silver_signal.json');
            const preciousVerdict = readVerdict('latest_precious_miners_signal.json');
            const qqqQldVerdict = readVerdict('qqq_qld_timing_signal.json');
            const n1Verdict = readVerdict('n1_latest_signal.json');
            const n1Report = readText('n1_latest_signal.md');
            const reportAll = readText('latest_signal_all.md');

            const actor = context.actor || '';
            const assignee = (actor && !actor.includes('github-actions')) ? actor : owner;
            const title = `📌 Daily Signals (${kstDate})`;
            const body = [
              `@${assignee}`,
              ``,
              `- KST 실행 시각: **${kstTime}**`,
              `- Workflow status: **${process.env.JOB_STATUS}**`,
              `- Run: ${runUrl}`,
              ``,
              `## Quick Summary`,
              `- N1 QQQ Meta shadow: **${n1Verdict}**`,
              `- QQQ/QLD Timing: **${qqqQldVerdict}**`,
              `- Core (VRT/MRVL): **${coreVerdict}**`,
              `- NatWest (NWG): **${nwgVerdict}**`,
              `- Energy: **${energyVerdict}**`,
              `- Silver: **${silverVerdict}**`,
              `- Precious Miners: **${preciousVerdict}**`,
              ``,
              `<details><summary>N1 Meta report</summary>`,
              ``, n1Report, ``, `</details>`,
              ``,
              `<details><summary>Full report</summary>`,
              ``, reportAll, ``, `</details>`,
              ``
            ].join('\n');

            try {
              await github.rest.issues.create({ owner, repo, title, body, assignees: [assignee] });
            } catch (e) {
              await github.rest.issues.create({ owner, repo, title, body });
            }
