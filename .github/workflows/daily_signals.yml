name: Daily Signals

on:
  workflow_dispatch:
    inputs:
      n1_repair_from:
        description: 'Optional: full SHA of a valid N1 checkpoint for ordered recovery'
        required: false
        default: ''
        type: string
  schedule:
    # 07:37 Asia/Seoul every day (22:37 UTC previous day)
    - cron: "37 22 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-signals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate scripts
        run: |
          python -m py_compile \
            monitor_signals.py \
            nwg_signal.py \
            energy_signal_monitor.py \
            silver_signal_monitor.py \
            precious_miners_signal_monitor.py \
            qqq_qld_timing_signal.py \
            n1_meta_signal.py \
            n1_meta_signal_core.py \
            n1_data_quality.py \
            n1_validate_outputs.py \
            build_latest_signal_all.py

      - name: Generate all signal files
        env:
          TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
        run: |
          set -euo pipefail
          python monitor_signals.py
          python nwg_signal.py
          python energy_signal_monitor.py
          python silver_signal_monitor.py
          python precious_miners_signal_monitor.py
          python qqq_qld_timing_signal.py
          python build_latest_signal_all.py

      - name: Generate validated N1 signal
        id: n1
        timeout-minutes: 10
        continue-on-error: true
        env:
          TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
          N1_REPAIR_FROM: ${{ inputs.n1_repair_from }}
        run: |
          set -euo pipefail
          if [ -n "$N1_REPAIR_FROM" ]; then
            python n1_meta_signal.py --repair-from "$N1_REPAIR_FROM"
          else
            python n1_meta_signal.py
          fi

      - name: Validate N1 output contract
        id: n1_contract
        if: steps.n1.outcome == 'success'
        continue-on-error: true
        run: |
          python n1_validate_outputs.py

      - name: Mark rejected N1 output
        if: steps.n1_contract.outcome == 'failure'
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import n1_meta_signal as runner
          import n1_meta_signal_core as core
          core.save_json(runner.STATUS_PATH, {
              'attempted_at': datetime.now(timezone.utc).isoformat(),
              'status': 'BLOCKED', 'data_missing': True, 'execution_target': None,
              'reason': 'OUTPUT_CONTRACT_REJECTED',
              'checkpoint_preserved': True,
          })
          PY

      - name: Upload N1 calculation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            n1_run_status.json
            n1_audit/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit and push if changed
        shell: bash
        env:
          N1_VALID: ${{ steps.n1.outcome == 'success' && steps.n1_contract.outcome == 'success' }}
        run: |
          set -euo pipefail

          FILES=(
            latest_signal.json
            latest_signal.md
            nwg_latest_signal.json
            nwg_latest_signal.md
            latest_energy_signal.json
            latest_energy_signal.md
            latest_silver_signal.json
            latest_silver_signal.md
            latest_precious_miners_signal.json
            latest_precious_miners_signal.md
            qqq_qld_timing_signal.json
            qqq_qld_timing_signal.md
            latest_signal_all.md
          )
          if [ "$N1_VALID" = "true" ]; then
            FILES+=(n1_latest_signal.json n1_latest_signal.md n1_latest_state_snapshot.json n1_liquidity_p_lineage.csv)
          fi
          if [ -f n1_run_status.json ]; then
            FILES+=(n1_run_status.json)
          fi

          if ! git status --porcelain -- "${FILES[@]}" | grep -q .; then
            echo "No signal changes to commit"
          else
            DATE=$(date -u +%F)
            BRANCH="${GITHUB_REF_NAME}"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add "${FILES[@]}"
            git commit -m "Update signals: ${DATE}"

            # Never rebase an old state transition over newer signal output.
            # A conflict must fail visibly and be regenerated from the new HEAD.
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Create Issue for today's report (always)
        if: always()
        uses: actions/github-script@v8
        env:
          JOB_STATUS: ${{ job.status }}
          N1_VALID: ${{ steps.n1.outcome == 'success' && steps.n1_contract.outcome == 'success' }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = new Date();
            const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
            const kstDate = kst.toISOString().slice(0, 10);
            const kstTime = kst.toISOString().replace('T', ' ').slice(0, 19);
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;

            const readText = (p) => {
              try { return fs.readFileSync(p, 'utf8'); }
              catch (e) { return `_(missing: ${p})_`; }
            };
            const readVerdict = (p) => {
              try {
                const obj = JSON.parse(fs.readFileSync(p, 'utf8'));
                return obj && (obj.verdict || obj.execution_target || obj.validation_class)
                  ? String(obj.verdict || obj.execution_target || obj.validation_class)
                  : 'N/A';
              } catch (e) { return 'N/A'; }
            };

            const coreVerdict = readVerdict('latest_signal.json');
            const nwgVerdict = readVerdict('nwg_latest_signal.json');
            const energyVerdict = readVerdict('latest_energy_signal.json');
            const silverVerdict = readVerdict('latest_silver_signal.json');
            const preciousVerdict = readVerdict('latest_precious_miners_signal.json');
            const qqqQldVerdict = readVerdict('qqq_qld_timing_signal.json');
            let n1Status = {};
            try { n1Status = JSON.parse(readText('n1_run_status.json')); } catch (e) {}
            const n1Valid = process.env.N1_VALID === 'true';
            const workflowStatus = n1Valid ? process.env.JOB_STATUS : 'failure';
            const n1Verdict = n1Valid ? readVerdict('n1_latest_signal.json') : '갱신 실패 · 신규 판정 중단';
            const n1Report = n1Valid ? readText('n1_latest_signal.md') : [
              '## N1 갱신 실패',
              '',
              '필수 데이터 또는 체크포인트 검증에 실패했습니다. 이번 실행에서 새로운 목표자산을 제시하지 않습니다.',
              `- 사유: ${n1Status.reason || 'N1 generation/contract step failed or did not run'}`,
              `- 이전 검증 신호: ${n1Status.previous_signal_date || '확인 불가 · 복구 필요'}`,
              '기존 정상 상태는 보존하며, 과거 상태가 손상된 경우 명시적 복구가 필요합니다.',
            ].join('\n');
            const reportAll = readText('latest_signal_all.md');

            const actor = context.actor || '';
            const assignee = (actor && !actor.includes('github-actions')) ? actor : owner;
            const title = `📌 Daily Signals (${kstDate})`;
            const body = [
              `@${assignee}`,
              ``,
              `- KST 실행 시각: **${kstTime}**`,
              `- Workflow status: **${workflowStatus}**`,
              `- Run: ${runUrl}`,
              ``,
              `## Quick Summary`,
              `- N1 QQQ Meta shadow: **${n1Verdict}**`,
              `- QQQ/QLD Timing: **${qqqQldVerdict}**`,
              `- Core (VRT/MRVL): **${coreVerdict}**`,
              `- NatWest (NWG): **${nwgVerdict}**`,
              `- Energy: **${energyVerdict}**`,
              `- Silver: **${silverVerdict}**`,
              `- Precious Miners: **${preciousVerdict}**`,
              ``,
              `<details><summary>N1 Meta report</summary>`,
              ``, n1Report, ``, `</details>`,
              ``,
              `<details><summary>Full report</summary>`,
              ``, reportAll, ``, `</details>`,
              ``
            ].join('\n');

            try {
              await github.rest.issues.create({ owner, repo, title, body, assignees: [assignee] });
            } catch (e) {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Fail visibly when N1 was not validated
        if: always() && (steps.n1.outcome != 'success' || steps.n1_contract.outcome != 'success')
        run: |
          echo 'N1 update blocked; see the Issue and n1-audit artifact. Previous checkpoint was not replaced with an unvalidated result.'
          exit 1
